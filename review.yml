  - date: '2026-09-01'
    rating: 2
    method: probed
    summary: >-
      Re-profiled under the API Evangelist university pipeline, which settles WHO OPERATES each
      surface before saving anything. The June 2026 review's headline finding stands and is
      confirmed: Wuhan University publishes no public API, no developer portal and no contract of
      any kind. What that review missed is an identity estate and a research-data archive that the
      institution genuinely operates. WHU runs a Shibboleth SAML 2.0 identity provider at
      idp.whu.edu.cn, registered in CARSI — China's national R&E identity federation and a
      production eduGAIN member — as 武汉大学 since 2024-12-10. It runs a campus CAS single-sign-on
      server at cas.whu.edu.cn that publishes a live OpenID Connect discovery document with a
      working JWKS, the only conforming machine-readable contract WHU serves to the anonymous
      public. And it operates an IGS Global Data Center: the International GNSS Service's own
      data-access page names Wuhan University and links ftp://igs.gnsswhu.cn/, an anonymously
      listable GNSS archive. Two defects are recorded rather than smoothed over: the Shibboleth
      IdP's self-published metadata is the un-customized template Shibboleth ships, expired
      2019-10-31, and is namespace-ill-formed — three SingleLogoutService elements use an undeclared
      md: prefix at lines 131-133, pointing at the placeholder host idp.xxx.edu.cn, so every
      namespace-aware parser fails on it with "unbound prefix"; and the CAS SAML metadata carries the vendor's defaults, scope "wisedu.com"
      and jsmith@example.org contacts. Library discovery is an Ex Libris Aleph tenancy and is
      recorded as a tenant relationship, not as a WHU contract. No OpenAPI was saved, derived or
      fabricated, because none exists.
    endpoints:
      - url: https://idp.whu.edu.cn/idp/shibboleth
        status: 200
        note: >-
          SAML 2.0 EntityDescriptor, application/xml, 14,864 bytes. Namespace-ill-formed (undeclared
          md: prefix, lines 131-133); expired 2019-10-31; Shibboleth's shipped template.
      - url: https://idp.whu.edu.cn/idp/profile/SAML2/Redirect/SSO
        status: 400
        note: Live Shibboleth SSO handler rejecting a request with no SAMLRequest.
      - url: https://cas.whu.edu.cn/authserver/oidc/.well-known/openid-configuration
        status: 200
        note: OpenID Connect discovery, application/json, 1,340 bytes. Declares alg "none" and the password grant.
      - url: https://cas.whu.edu.cn/authserver/oidc/jwks
