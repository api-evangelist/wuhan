aid: wuhan
name: Wuhan University
x-type: university
x-category: Public Research University
description: >-
  Wuhan University (武汉大学, WHU), founded in 1893 in Wuhan, Hubei, is a comprehensive public
  research university under China's Ministry of Education, a Double First-Class and former Project
  985 institution, and is strongest in surveying, remote sensing, geoinformatics and GNSS. It
  operates no public developer portal, no open data portal and no documented public API: api.,
  data., open. and developer. under whu.edu.cn do not resolve, /.well-known/apis.json, llms.txt,
  security.txt, robots.txt and sitemap.xml all return 404 on both the Chinese and English sites,
  and no OpenAPI, AsyncAPI or GraphQL contract exists anywhere in this profile. What it does
  operate, on its own CERNET address space, is an identity estate and a bulk research-data
  archive. Wuhan University runs a Shibboleth SAML 2.0 identity provider registered in CARSI,
  China's national research-and-education federation and a production eduGAIN member, and a
  campus CAS single-sign-on server that publishes a live OpenID Connect discovery document — the
  only conforming, self-describing, machine-readable contract WHU serves to the anonymous public,
  and it is the SSO product's shape rather than WHU engineering. It also operates one of the IGS
  Global Data Centers: the International GNSS Service's own data-access page names Wuhan
  University and links ftp://igs.gnsswhu.cn/, an anonymously listable archive of GPS, BDS, MGEX,
  high-rate and IERS products. Library discovery is an Ex Libris Aleph tenancy on a WHU host, and
  the registrar system is behind campus SSO. The institution's only evidenced education-regime
  conformance is SAML and Shibboleth; it is not a DataCite or Crossref depositing member, and no
  institution-operated OAI-PMH endpoint was found.
