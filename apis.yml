x-coverage:
  state: none
  reason: no_public_api
  detail: >-
    Wuhan University publishes no public API, no developer portal and no contract of any kind, and
    that is the honest result rather than a wall we hit. api., data., open., developer., dspace.,
    repository. and library. under whu.edu.cn return no DNS answer; /.well-known/apis.json,
    /.well-known/security.txt, /llms.txt, /robots.txt and /sitemap.xml are 404 on both www.whu.edu.cn
    and en.whu.edu.cn; and no OpenAPI, AsyncAPI, GraphQL SDL or Postman collection was located
    anywhere, so none has been saved and none has been derived.

    Four institution-operated surfaces WERE confirmed live, all on CERNET address space allocated
    to the Wuhan region or attributed by a standards body, and all are recorded above: the
    Shibboleth SAML 2.0 identity provider at idp.whu.edu.cn, registered in CARSI since 2024-12-10;
    the campus CAS/OIDC/SAML single-sign-on server at cas.whu.edu.cn, whose OpenID Connect
    discovery document is the only conforming machine-readable contract WHU serves the public; the
    IGS Global Data Center at ftp://igs.gnsswhu.cn/pub/, which the International GNSS Service's own
    data-access page attributes to Wuhan University; and the journal platform at ch.whu.edu.cn.
    None of the four publishes an API specification. The IdP's self-published metadata is Shibboleth's
    shipped template, expired in 2019, and namespace-ill-formed (undeclared md: prefix at lines
    131-133, so namespace-aware parsers fail with "unbound prefix") — the service conforms, the
    document describing it does not.

    Library discovery is an Ex Libris Aleph tenancy and is recorded as a tenant relationship, not
    as a WHU contract. The registrar system jwgl.whu.edu.cn is real and institution-operated but
    sits behind campus SSO. One host, ir.whu.edu.cn, returns 403 from an openresty edge on every
    path and every user-agent tried, so it is unreadable from outside China and is deliberately NOT
    characterized here — a 403 with no body is not evidence of an institutional repository.

    Language was not the barrier: the Chinese-language estate was searched alongside the English
    one, and the only English-only gap found is the reverse — the CAS protocol errors are emitted
    in Chinese only.
