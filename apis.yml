  x-operator: institution
  x-operator-basis: >-
    ch.whu.edu.cn resolves to 115.156.123.29, netname WHR-CERNET, the same Wuhan CERNET allocation
    as idp. and cas.whu.edu.cn. WHU-run publishing platform, no vendor CNAME.
